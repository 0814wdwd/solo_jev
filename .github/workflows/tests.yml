name: tests

# The offline half of this project — encodings, the cost objective, planning,
# packing — needs no API key and no network, so it is fully testable in CI.
# Anything that talks to a real endpoint is deliberately not run here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Probes build valid payloads without a key
        run: python probes/probe_cache.py --dry-run --reps 2 --state-rows 8
