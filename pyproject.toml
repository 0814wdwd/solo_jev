[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-solo"
version = "0.1.0"
description = "Per-row judgements over large relational tables on a decision model, without paying to write the same text a million times"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yingze Li" }, { name = "Dong Wang" }]
keywords = ["llm", "database", "analytics", "decision-model", "jev", "typesafe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The offline half -- encodings, the cost objective, planning, packing -- needs only
# numpy. tiktoken is the default token-count proxy; swap it via tokens.get_counter.
dependencies = [
    "numpy>=1.24",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
# Talking to a real endpoint.
api = ["requests>=2.28"]
# Running the benchmarks and analyses end to end.
bench = ["requests>=2.28", "pandas>=2.0"]
dev = ["pytest>=7.0", "requests>=2.28", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/OWNER/jev-solo"
Issues = "https://github.com/OWNER/jev-solo/issues"

[tool.setuptools]
packages = ["jev_solo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
